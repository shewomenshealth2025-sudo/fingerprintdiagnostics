<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password | Fingerprint Diagnostics</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="pack2.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html"><span class="brand-mark">FD</span><span>Fingerprint Diagnostics</span></a>
      <nav class="nav-links"><a href="login.html">Back to sign in</a></nav>
    </div>
  </header>

  <main class="pack2-auth">
    <section class="pack2-card narrow-card">
      <span class="eyebrow">Account recovery</span>
      <h1>Reset your password.</h1>
      <p>Enter your email to display the prototype confirmation state.</p>

      <form id="reset-form" class="pack2-form">
        <label>Email address<input type="email" placeholder="you@example.com" required /></label>
        <button class="button primary full" type="submit">Send reset link</button>
      </form>

      <div id="success" class="pack2-success" hidden>
        <strong>Check your inbox</strong>
        <p>A demonstration reset link has been generated. No real email has been sent.</p>
        <a class="button secondary full" href="login.html">Return to sign in</a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script src="pack2.js"></script>
  <script>
    document.getElementById("reset-form").addEventListener("submit", (event) => {
      event.preventDefault();
      event.target.hidden = true;
      document.getElementById("success").hidden = false;
    });
  </script>
</body>
</html>
