<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pack2.css">
<link rel="stylesheet" href="pack3.css">
<link rel="stylesheet" href="pack4.css">
<link rel="stylesheet" href="pack5.css">

</head>
<body class="pack2-dashboard">
<aside class="pack2-sidebar">
  <a class="brand" href="index.html"><span class="brand-mark">FD</span><span>Fingerprint<br>Diagnostics</span></a>
  <nav class="pack2-side-nav">
    <a href="dashboard.html">Overview</a>
    <a href="patient-portal.html">Patient portal</a>
    <a href="clinician-portal.html">Clinician portal</a>
    <a href="fingerprint-engine.html">Fingerprint engine</a>
    <a class="active" href="disease-library.html">Disease library</a>
    <a href="biomarker-library.html">Biomarkers</a>
    <a href="profile.html">Profile</a>
    <a href="settings.html">Settings</a>
    <a href="notifications.html">Notifications</a>
    <a href="index.html">Website</a>
  </nav>
  <button class="pack2-logout" data-logout>Sign out</button>
</aside>
<main class="pack2-main">

<header class="pack2-header">
  <div><span class="eyebrow">Model library</span><h1>Disease fingerprints.</h1><p>Research-stage disease and condition patterns available in the prototype.</p></div>
</header>
<section id="disease-models" class="pack5-model-grid"></section>

</main>
<script src="script.js"></script>
<script src="pack2.js"></script>
<script src="pack3.js"></script>
<script src="pack4.js"></script>
<script src="pack5.js"></script>
<script>
fdRequireUser();

document.getElementById("disease-models").innerHTML=fd5Models().map(m=>'<article class="pack5-model-card"><span class="eyebrow">'+m.version+'</span><h2>'+m.name+'</h2><p>'+m.description+'</p><div class="pack3-tags" style="margin:18px 0">'+m.ridges.map(r=>'<span class="pack3-tag">'+r.name+'</span>').join("")+'</div><a class="button secondary" href="fingerprint-engine.html" data-model="'+m.id+'">Open model</a></article>').join("");
document.querySelectorAll("[data-model]").forEach(a=>a.onclick=()=>localStorage.setItem(FD5_ACTIVE_MODEL_KEY,a.dataset.model));

</script>
</body>
</html>
